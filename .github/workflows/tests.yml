# Runs every Pocket Ledger test on each push (GitHub › Actions shows ✓ or ✗).
# Uses the mocks in tests/mockfb, so no Firebase project, keys or real data are touched.
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g playwright@1 && npx playwright install --with-deps chromium
      - run: node scripts/bump.js --check
      - run: bash tests/run-all.sh
        env: { JOBS: "3" }
